name: djscord

services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE must be set to an immutable ECR image tag}
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - .env
    init: true
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    volumes:
      - ${DATA_DIR:-/opt/djscord/data}:/data
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /djscord/prod/bot
        awslogs-stream-prefix: bot

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine@sha256:96be2be7ee50d35a9bd42c8c7b99e2a4b741f09123066c1ebb9e014dd7db204d
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?LAVALINK_PASSWORD is required}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:?YOUTUBE_REFRESH_TOKEN is required}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1536m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Authorization: $$LAVALINK_PASSWORD\" -O /dev/null http://127.0.0.1:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:exec,uid=322,gid=65533,mode=1777
      - /opt/Lavalink/plugins:uid=322,gid=65533,mode=0770
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    mem_limit: 2g
    cpus: 1.25
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /djscord/prod/lavalink
        awslogs-stream-prefix: lavalink
