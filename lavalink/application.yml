server:
  address: 0.0.0.0
  port: 2333

lavalink:
  pluginsDir: /opt/Lavalink/plugins
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:34ee4c5f6b4608c19880ff62f80540c0048f537e"
      snapshot: true
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false
      soundcloud: false
      bandcamp: false
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false
    filters:
      volume: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 50

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - IOS

    clientOptions:
      WEB:
        playback: false
        playlistLoading: false
        videoLoading: false
        searching: true

      IOS:
        playback: true
        searching: false

    oauth:
      enabled: false

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "djscord"


logging:
  request:
    enabled: false
    includeClientInfo: false
    includeHeaders: false
    includePayload: false
    includeQueryString: false
  file:
    path: /tmp/lavalink-logs
  level:
    root: INFO
    lavalink: INFO
    lavalink.server.player: INFO
    com.sedmelluq.discord.lavaplayer: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

metrics:
  prometheus:
    enabled: false
