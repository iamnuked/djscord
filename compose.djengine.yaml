services:
  bot:
    depends_on:
      engine:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    environment:
      DJENGINE_API_KEY: ${DJENGINE_API_KEY:?DJENGINE_API_KEY is required}
      DJENGINE_BASE_URL: http://engine:8787
    networks:
      - default
      - djengine-private

  engine:
    build:
      context: ../djengine
      target: runtime
    environment:
      DJENGINE_ALLOW_REMOTE: "true"
      DJENGINE_API_KEY: ${DJENGINE_API_KEY:?DJENGINE_API_KEY is required}
      DJENGINE_BIND: 0.0.0.0:8787
      DJENGINE_DATA_DIR: /data
      DJENGINE_MUSIC_ROOT: /music
      DJENGINE_PUBLIC_BASE_URL: http://engine:8787
      DJENGINE_REKORDBOX_XML: /config/rekordbox.xml
      RUST_LOG: ${DJENGINE_RUST_LOG:-djengine_server=info}
    expose:
      - "8787"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8787/readyz]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    read_only: true
    restart: unless-stopped
    networks:
      - djengine-private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - djengine-data:/data
      - type: bind
        source: ${DJENGINE_HOST_MUSIC_ROOT:?DJENGINE_HOST_MUSIC_ROOT is required}
        target: /music
        read_only: true
      - type: bind
        source: ${DJENGINE_HOST_REKORDBOX_XML:?DJENGINE_HOST_REKORDBOX_XML is required}
        target: /config/rekordbox.xml
        read_only: true

  lavalink:
    networks:
      - default
      - djengine-private

volumes:
  djengine-data:

networks:
  djengine-private:
    internal: true
